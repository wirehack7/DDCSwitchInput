name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/DdcTraySwitcher.csproj

      - name: Build project
        run: dotnet build src/DdcTraySwitcher.csproj -c Release --no-restore

      - name: Publish EXE
        run: dotnet publish src/DdcTraySwitcher.csproj -c Release --no-build -o ./publish

      - name: Get version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/DdcTraySwitcher.exe
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## DDC Input Switcher - ${{ steps.get_version.outputs.VERSION }}
            
            ### Download
            Download the `DdcTraySwitcher.exe` file below and run it.
            
            ### What's Changed
            See the commit history for details on what changed in this release.
            
            ### Requirements
            - Windows 10 or later
            - .NET 8.0 Runtime (included in the executable)
            - Monitor(s) with DDC/CI support
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
